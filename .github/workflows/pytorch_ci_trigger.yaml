name: pytorch-ci-trigger

# ---------------------------------------------------------------------------
# Entry point for repository_dispatch events sent by pytorch/pytorch (or its
# CI relay) when a PR merges to main. Forwards the raw dispatch payload to
# receive_pytorch_trigger.yaml, which does the gating/extraction and kicks
# off the build-from-source + test pipeline.
# ---------------------------------------------------------------------------
on:
  repository_dispatch:
    types: [pull_request]

permissions:
  contents: read
  # Needed for OIDC if/when the cross-repo-ci-relay-callback reporting steps
  # in build_test_pytorch_source.yaml are uncommented.
  id-token: write

jobs:
  forward:
    uses: ./.github/workflows/receive_pytorch_trigger.yaml
    secrets: inherit
    with:
      event_type: ${{ github.event.client_payload.event_type }}
      payload: ${{ toJSON(github.event.client_payload) }}
