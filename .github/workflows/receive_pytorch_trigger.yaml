name: receive-pytorch-trigger

# ---------------------------------------------------------------------------
# Reusable workflow — not triggered directly. Called by pytorch_ci_trigger.yaml.
#
# Gates the incoming pytorch/pytorch dispatch (only merged PRs targeting
# main), extracts the exact PyTorch commit SHA to build, and hands off to
# build_test_pytorch_source.yaml.
# ---------------------------------------------------------------------------
on:
  workflow_call:
    inputs:
      event_type:
        description: client_payload.event_type from the dispatch (pull_request | push)
        required: true
        type: string
      payload:
        description: JSON-encoded client_payload from the dispatch
        required: true
        type: string

jobs:
  extract:
    name: Extract build parameters from payload
    runs-on: ubuntu-latest
    outputs:
      pytorch_sha: ${{ steps.extract.outputs.pytorch_sha }}
      should_build: ${{ steps.extract.outputs.should_build }}
    steps:
      - name: Extract build parameters from payload
        id: extract
        env:
          PAYLOAD_JSON: ${{ inputs.payload }}
          EVENT_TYPE: ${{ inputs.event_type }}
        run: |
          set -euo pipefail

          # ---- Filter: only merged PRs targeting main ----
          if [ "${EVENT_TYPE}" = "pull_request" ]; then
            ACTION=$(echo "$PAYLOAD_JSON" | jq -r '.payload.action // empty')
            BASE_REF=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.base.ref // empty')
            if [ "${ACTION}" != "closed" ]; then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${BASE_REF}" != "main" ]; then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # .pull_request.merged is unreliable on repository_dispatch
            # payloads, so gate on the "Merged" label instead.
            HAS_MERGED=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.labels // [] | map(.name) | index("Merged") // ""')
            if [ -z "${HAS_MERGED}" ]; then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Build the exact commit that was merged, not just latest main.
            SHA=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.merge_commit_sha // empty')
            if [ -z "${SHA}" ]; then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "pytorch_sha=${SHA}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${EVENT_TYPE}" = "push" ]; then
            # Not wired up yet — push dispatches are ignored for now.
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unknown event_type: ${EVENT_TYPE}"
            exit 1
          fi

  build_and_test:
    needs: extract
    if: ${{ needs.extract.outputs.should_build == 'true' }}
    uses: ./.github/workflows/build_test_pytorch_source.yaml
    secrets: inherit
    with:
      pytorch_sha: ${{ needs.extract.outputs.pytorch_sha }}
